<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gambar ke Link PNG</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #10141c;
    color: #fff;
    font-family: Arial, sans-serif;
}

.box {
    width: 500px;
    max-width: 94%;
    background: #181e29;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

h2 {
    text-align: center;
    margin-top: 0;
}

.api-input,
.link-input {
    width: 100%;
    padding: 13px;
    background: #0f141d;
    color: white;
    border: 1px solid #30394a;
    border-radius: 10px;
    outline: none;
    margin-bottom: 15px;
}

.upload {
    border: 2px dashed #3d485b;
    padding: 35px 15px;
    border-radius: 14px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
}

.upload:hover {
    border-color: #6096ff;
    background: #1d2532;
}

#fileInput {
    display: none;
}

.preview {
    display: none;
    margin-top: 20px;
    text-align: center;
}

.preview img {
    max-width: 100%;
    max-height: 320px;
    border-radius: 12px;
}

.result {
    display: none;
    margin-top: 20px;
}

button {
    width: 100%;
    border: 0;
    padding: 13px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

.copy {
    background: #3b82f6;
    color: white;
}

.open {
    background: #16a34a;
    color: white;
}

.status {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="box">

    <h2>🖼 Gambar → Link PNG</h2>

    <!-- API KEY -->
    <input
        type="password"
        id="apiKey"
        class="api-input"
        placeholder="Masukkan ImgBB API Key"
    >

    <!-- UPLOAD -->
    <div class="upload" id="uploadBox">
        <b>Klik Pilih Gambar</b>
        <br><br>
        JPG • JPEG • WEBP • PNG
    </div>

    <input
        type="file"
        id="fileInput"
        accept="image/*"
    >

    <!-- PREVIEW -->
    <div class="preview" id="preview">
        <img id="previewImg">
    </div>

    <!-- RESULT -->
    <div class="result" id="result">

        <input
            type="text"
            id="resultLink"
            class="link-input"
            readonly
        >

        <button
            class="copy"
            onclick="copyLink()"
        >
            📋 Copy Link PNG
        </button>

        <button
            class="open"
            onclick="openImage()"
        >
            🔗 Buka Gambar
        </button>

    </div>

    <div class="status" id="status"></div>

</div>


<script>

const uploadBox =
    document.getElementById("uploadBox");

const fileInput =
    document.getElementById("fileInput");

const preview =
    document.getElementById("preview");

const previewImg =
    document.getElementById("previewImg");

const result =
    document.getElementById("result");

const resultLink =
    document.getElementById("resultLink");

const status =
    document.getElementById("status");


// ============================================
// KLIK PILIH GAMBAR
// ============================================

uploadBox.onclick = () => {

    fileInput.click();

};


// ============================================
// PILIH GAMBAR
// ============================================

fileInput.onchange = function() {

    if (!this.files.length)
        return;

    convertToPNG(this.files[0]);

};


// ============================================
// CONVERT GAMBAR MENJADI PNG
// ============================================

function convertToPNG(file) {

    const apiKey =
        document.getElementById("apiKey").value.trim();


    if (!apiKey) {

        status.style.color = "#ff6b6b";

        status.innerHTML =
            "Masukkan API Key ImgBB terlebih dahulu.";

        fileInput.value = "";

        return;

    }


    if (!file.type.startsWith("image/")) {

        status.style.color = "#ff6b6b";

        status.innerHTML =
            "File harus berupa gambar.";

        return;

    }


    status.style.color = "#facc15";

    status.innerHTML =
        "⏳ Mengubah gambar menjadi PNG...";


    const reader = new FileReader();


    reader.onload = function(e) {

        const img = new Image();


        img.onload = function() {

            const canvas =
                document.createElement("canvas");


            canvas.width =
                img.naturalWidth;

            canvas.height =
                img.naturalHeight;


            const ctx =
                canvas.getContext("2d");


            // transparan
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // gambar asli
            ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Convert menjadi PNG asli
            canvas.toBlob(

                function(blob) {

                    if (!blob) {

                        status.innerHTML =
                            "Gagal convert PNG.";

                        return;

                    }


                    // preview
                    const previewURL =
                        URL.createObjectURL(blob);

                    previewImg.src =
                        previewURL;

                    preview.style.display =
                        "block";


                    // upload
                    uploadPNG(
                        blob,
                        apiKey
                    );

                },

                "image/png",

                1

            );

        };


        img.src = e.target.result;

    };


    reader.readAsDataURL(file);

}


// ============================================
// UPLOAD PNG KE IMGBB
// ============================================

async function uploadPNG(blob, apiKey) {

    status.style.color = "#facc15";

    status.innerHTML =
        "☁️ Mengupload PNG...";


    try {

        const formData =
            new FormData();


        // Membuat file PNG
        const fileName =
            "gambar-" +
            Date.now() +
            ".png";


        const pngFile =
            new File(
                [blob],
                fileName,
                {
                    type: "image/png"
                }
            );


        formData.append(
            "image",
            pngFile
        );


        formData.append(
            "name",
            fileName.replace(".png", "")
        );


        const response =
            await fetch(

                "https://api.imgbb.com/1/upload?key=" +
                encodeURIComponent(apiKey),

                {
                    method: "POST",
                    body: formData
                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data?.error?.message ||
                "Upload gagal"
            );

        }


        // LINK GAMBAR LANGSUNG
        const directURL =
            data.data.url;


        resultLink.value =
            directURL;


        result.style.display =
            "block";


        status.style.color =
            "#4ade80";


        status.innerHTML =
            "✓ Berhasil! Gambar sudah menjadi link PNG.";


    }

    catch(error) {

        console.error(error);


        status.style.color =
            "#ff6b6b";


        status.innerHTML =
            "❌ Upload gagal: " +
            error.message;

    }

}


// ============================================
// COPY LINK
// ============================================

async function copyLink() {

    const link =
        resultLink.value;


    if (!link)
        return;


    try {

        await navigator.clipboard.writeText(
            link
        );


        status.style.color =
            "#4ade80";


        status.innerHTML =
            "✓ Link PNG berhasil dicopy!";

    }

    catch {

        resultLink.select();

        document.execCommand("copy");

    }

}


// ============================================
// BUKA GAMBAR
// ============================================

function openImage() {

    const link =
        resultLink.value;


    if (link) {

        window.open(
            link,
            "_blank"
        );

    }

}

</script>

</body>
</html>
